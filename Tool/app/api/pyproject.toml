[project]
name = "car-reporting-api"
version = "0.1.0"
description = "Agentic AI Regulatory Reporting Platform — CAR-SA-01 backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "weasyprint>=61.0",
    "langgraph>=0.0.40",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
